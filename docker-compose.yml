services:
  postgres:
    image: postgres:16-alpine
    container_name: affeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: affeto
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - affeto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d affeto"]
      interval: 3s
      timeout: 3s
      retries: 5

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affeto-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: affeto
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi_password
      DATABASE_SSL: "false"
      APP_KEYS: "appKeyA,appKeyB,appKeyC,appKeyD"
      API_TOKEN_SALT: "apiTokenSaltAffetoSecret12345"
      ADMIN_JWT_SECRET: "adminJwtSecretAffetoSecret12345"
      TRANSFER_TOKEN_SALT: "transferTokenSaltAffetoSecret12345"
      JWT_SECRET: "frontendJwtSecretAffetoSecret12345"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock_secret_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock_webhook_secret}
      FRONTEND_URL: http://localhost:4321
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - affeto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: affeto-frontend
    restart: unless-stopped
    depends_on:
      - strapi
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_STRAPI_URL: http://localhost:1337
      INTERNAL_STRAPI_URL: http://strapi:1337
    ports:
      - "4321:4321"
    networks:
      - affeto-network

  caddy:
    image: caddy:2-alpine
    container_name: affeto-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - strapi
    networks:
      - affeto-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  affeto-network:
    driver: bridge
