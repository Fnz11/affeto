version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: affeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-affeto}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - affeto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-affeto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affeto-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-affeto}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi_password}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS:-keyA,keyB,keyC,keyD}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-apitokensalt1234567890}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-adminjwtsecret1234567890}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-transfertokensalt1234567890}
      JWT_SECRET: ${JWT_SECRET:-jwtsecret1234567890}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4321}
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - affeto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: affeto-frontend
    restart: unless-stopped
    depends_on:
      - strapi
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL:-http://localhost:1337}
      INTERNAL_STRAPI_URL: http://strapi:1337
    ports:
      - "4321:4321"
    networks:
      - affeto-network

  caddy:
    image: caddy:2-alpine
    container_name: affeto-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - strapi
    networks:
      - affeto-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  affeto-network:
    driver: bridge
